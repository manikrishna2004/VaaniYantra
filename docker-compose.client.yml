# A dedicated (client-cloud) install: web, voice, and the client's own Postgres.
#
#   cp .env.client.example .env
#   docker compose -f docker-compose.client.yml up -d
#   docker compose -f docker-compose.client.yml exec web npx prisma db push
#
# ── The database in here is THEIRS ──────────────────────────────────────────
#
# That is a feature of this mode, not an accident of it: data residency is half
# of why a client asks for it. The control plane never reads this database and
# must never be built to — everything we learn about this install arrives over
# the outbound channel in src/lib/deploy, as telemetry that billing does not
# read.
#
# ── What is deliberately absent ─────────────────────────────────────────────
#
# No Cashfree credentials, no SUPERADMIN_EMAILS, no cron secrets, and above all
# no platform-level OmniDimension key — that one can move credits between every
# client's sub-account, so a client with root on this box would be able to read
# every other client's minutes. See FORBIDDEN_IN_DEDICATED in
# src/lib/deploy/deployment.ts, which is the list this file is checked against.
#
# Images are pinned by immutable tag. `latest` is never used here: when this
# install heartbeats, the tag it reports has to be an answer.

name: vaaniyantra

services:
  web:
    image: ${VAANI_IMAGE:?set VAANI_IMAGE to an immutable tag, e.g. ghcr.io/OWNER/vaaniyantra-runtime:2026.09.03-4ab3175}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DEPLOYMENT_MODE: dedicated
      DEPLOYMENT_ID: ${DEPLOYMENT_ID:?}
      DEPLOYMENT_ORG_ID: ${DEPLOYMENT_ORG_ID:?}
      DEPLOYMENT_KEY: ${DEPLOYMENT_KEY:?}
      CONTROL_PLANE_URL: ${CONTROL_PLANE_URL:-https://vaaniyantra.com}
      DEPLOYMENT_VERSION: ${VAANI_IMAGE}
      DATABASE_URL: postgresql://vaani:${POSTGRES_PASSWORD:?}@db:5432/vaani?schema=public
      SECRET_ENC_KEY: ${SECRET_ENC_KEY:?}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?}
      NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY:?}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN:?}
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID:?}
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET:?}
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID:?}
      NEXT_PUBLIC_FIREBASE_APP_ID: ${NEXT_PUBLIC_FIREBASE_APP_ID:?}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
    ports:
      - '${WEB_PORT:-3000}:3000'

  voice:
    image: ${VAANI_VOICE_IMAGE:?set VAANI_VOICE_IMAGE to an immutable tag}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DEPLOYMENT_MODE: dedicated
      DEPLOYMENT_ID: ${DEPLOYMENT_ID:?}
      DEPLOYMENT_ORG_ID: ${DEPLOYMENT_ORG_ID:?}
      DATABASE_URL: postgresql://vaani:${POSTGRES_PASSWORD:?}@db:5432/vaani?schema=public
      SECRET_ENC_KEY: ${SECRET_ENC_KEY:?}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
    ports:
      - '${VOICE_PORT:-8080}:8080'

  db:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: vaani
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: vaani
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vaani -d vaani']
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - vaani-db:/var/lib/postgresql/data
    # Not published. The two app containers reach it over the compose network;
    # exposing 5432 on a client's box is an invitation nobody needs.

volumes:
  vaani-db:
